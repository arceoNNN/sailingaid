<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sailing Aid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Sailing Aid</h1>

  <section id="setup">
    <h2>Setup</h2>
    <label>Wind direction (deg, true):
      <div class="field-with-buttons">
        <button type="button" onclick="adjustWindDir(-1)">−</button>
        <input id="windDir" type="number" value="0" step="1">
        <button type="button" onclick="adjustWindDir(1)">+</button>
      </div>
    </label>
    <label>True wind speed TWS (kt):
      <div class="field-with-buttons">
        <button type="button" onclick="adjustTWS(-0.5)">−</button>
        <input id="tws" type="number" value="10" step="0.5">
        <button type="button" onclick="adjustTWS(0.5)">+</button>
      </div>
    </label>

    <h3>Next mark</h3>
    <label>Mark lat:
      <input id="markLat" type="number">
    </label>
    <label>Mark lon:
      <input id="markLon" type="number">
    </label>

    <button id="startBtn">Start tracking</button>
  </section>

  <section id="live">
    <h2>Live</h2>
    <p id="gpsStatus">GPS: not started</p>
    <p id="boatInfo"></p>
    <p id="headingInfo"></p>
    <p id="speedInfo"></p>
    <p id="twaInfo"></p>
    <p id="vmgMarkInfo"></p>
    <p id="markInfo"></p>
    <p id="vmgInfo"></p>
    <p id="speedPolarInfo"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
