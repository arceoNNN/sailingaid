<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sailing Aid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Sailing Aid</h1>

  <section id="setup">
    <h2>Setup</h2>
    <label>Wind direction (deg, true):
      <div class="field-with-buttons">
        <button type="button" onclick="adjustWindDir(-1)">−</button>
        <input id="windDir" type="number" value="0" step="1">
        <button type="button" onclick="adjustWindDir(1)">+</button>
      </div>
    </label>
    <label>True wind speed TWS (kt):
      <div class="field-with-buttons">
        <button type="button" onclick="adjustTWS(-0.5)">−</button>
        <input id="tws" type="number" value="10" step="0.5">
        <button type="button" onclick="adjustTWS(0.5)">+</button>
      </div>
    </label>

    <h3>Next mark (single)</h3>
    <label>Mark lat (decimal degrees):
      <input id="markLat" type="number" step="0.00001">
    </label>
    <label>Mark lon (decimal degrees):
      <input id="markLon" type="number" step="0.00001">
    </label>

    <h3>Gate (optional)</h3>
    <label>
      <input id="useGate" type="checkbox">
      Use gate instead of single mark
    </label>
    <label>Gate left lat (decimal degrees):
      <input id="gateLeftLat" type="number" step="0.00001">
    </label>
    <label>Gate left lon (decimal degrees):
      <input id="gateLeftLon" type="number" step="0.00001">
    </label>
    <label>Gate right lat (decimal degrees):
      <input id="gateRightLat" type="number" step="0.00001">
    </label>
    <label>Gate right lon (decimal degrees):
      <input id="gateRightLon" type="number" step="0.00001">
    </label>

    <button id="startBtn">Start tracking</button>
  </section>

  <section id="converter">
    <h2>Coordinate converter</h2>
    <p class="hint">
      Paste coordinates in formats like:<br>
      <code>36°45.123'N</code> or <code>36 45.123 N</code> or <code>36.75205</code>.
    </p>
    <label>Lat (DMS / DM / decimal):
      <input id="convLat" type="text" placeholder="e.g. 36°45.123'N">
    </label>
    <label>Lon (DMS / DM / decimal):
      <input id="convLon" type="text" placeholder="e.g. 27°18.456'E">
    </label>
    <button type="button" onclick="convertCoords()">Convert → fill single mark</button>
    <p id="convStatus" class="status"></p>
  </section>

  <section id="live">
    <h2>Live</h2>
    <p id="gpsStatus">GPS: not started</p>
    <p id="boatInfo"></p>
    <p id="headingInfo"></p>
    <p id="speedInfo"></p>
    <p id="twaInfo"></p>
    <p id="vmgMarkInfo"></p>
    <p id="markInfo"></p>
    <p id="laylineInfo"></p>
    <p id="vmgInfo"></p>
    <p id="speedPolarInfo"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
